# A thin wrapper: the check is .nix/scripts/ci/, so it moves with the repo.
name: ci
on:
  pull_request:
  push:
    branches: [master]
    paths: [".nix/**", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  hosts:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: .nix/scripts/ci/build-hosts.sh
