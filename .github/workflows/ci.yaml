# A thin wrapper: the check is .nix/scripts/ci/, so it moves with the repo.
name: ci
on:
  pull_request:
  push:
    branches: [master]
    paths: [".nix/**", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  hosts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: .nix/scripts/ci/build-hosts.sh
