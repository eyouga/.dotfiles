# A thin wrapper: the check is .nix/scripts/ci/, so it moves with the repo.
name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  hosts:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix develop ./.nix -c .nix/scripts/ci/all.sh
